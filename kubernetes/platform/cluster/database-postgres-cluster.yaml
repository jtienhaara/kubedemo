#
#     https://cloudnative-pg.io/documentation/1.22/
#     https://github.com/cloudnative-pg/cloudnative-pg/blob/main/LICENSE
#
#
# The "postgres-super-user" and "postgres-replication-user" Secrets must
# already have been created in the "db" Namespace, by apply_database.sh,
# before deploying the manifests here.
#
# Modifications to the original:
# - Removed "cluster-example-app-user" Secret, replaced reference to it
#   with "postgres-super-user" Secret.
# - Removed "cluster-example-superuser" Secret, replaced reference to it
#   with "postgres-kubedemo-user" Secret.
# - Removed "backup-creds" Secret, replaced with reference to Secret
#   created by Rook/Ceph when database-postgres-storage.yaml was deployed.
#

# Example of definition of a test cluster using all the elements available
# in the CRD. Please change values appropriately for your environment.
# Remember that you can take advantage of convention over configuration
# and normally you don't need to use all these definitions.

# !!! "http://${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESSKEY}@${BUCKET_HOST}:${BUCKET_PORT}"

---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
spec:
  description: "kubedemo Postgres cluster"
  imageName: ghcr.io/cloudnative-pg/postgresql:16.1
  # imagePullSecret is only required if the images are located in a private registry
  # imagePullSecrets:
  #   - name: private_registry_access
  instances: 3
  startDelay: 300
  stopDelay: 300
  primaryUpdateStrategy: unsupervised

  postgresql:
    parameters:
      shared_buffers: 256MB
      pg_stat_statements.max: '10000'
      pg_stat_statements.track: all
      auto_explain.log_min_duration: '10s'
    pg_hba:
      - host all all 10.244.0.0/16 md5

  bootstrap:
    initdb:
      database: kubedemo
      owner: kubedemo
      secret:
        name: postgres-kubedemo-user

  enableSuperuserAccess: true
  superuserSecret:
    name: postgres-super-user

  storage:
    storageClass: kubedemo-block
    size: 1Gi

  # !!! backup:
  # !!!   barmanObjectStore:
  # !!!     destinationPath: !!! s3://cluster-example-full-backup/
  # !!!     endpointURL: !!! http://custom-endpoint:1234
  # !!!     s3Credentials:
  # !!!       accessKeyId:
  # !!!         name: postgres-bucket
  # !!!         key: AWS_ACCESS_KEY_ID
  # !!!       secretAccessKey:
  # !!!         name: postgres-bucket
  # !!!         key: AWS_SECRET_ACCESS_KEY
  # !!!         !!!
  # !!!     wal:
  # !!!       compression: gzip
  # !!!       encryption: AES256
  # !!!     data:
  # !!!       compression: gzip
  # !!!       encryption: AES256
  # !!!       immediateCheckpoint: false
  # !!!       jobs: 2
  # !!!   retentionPolicy: "30d"

  resources:
    requests:
      memory: "512Mi"
      cpu: "1"
    limits:
      memory: "1Gi"
      cpu: "2"

  affinity:
    enablePodAntiAffinity: true
    topologyKey: failure-domain.beta.kubernetes.io/zone

  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: false
