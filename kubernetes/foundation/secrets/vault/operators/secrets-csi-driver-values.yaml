#
# CSI driver Helm Chart values from:
#
#     https://github.com/kubernetes-sigs/secrets-store-csi-driver/blob/v1.4.1/charts/secrets-store-csi-driver/values.yaml
#
# Documentation:
#
#     https://github.com/kubernetes-sigs/secrets-store-csi-driver/tree/v1.4.1/charts/secrets-store-csi-driver#configuration
#
# Apache 2.0 license:
#
#     https://github.com/kubernetes-sigs/secrets-store-csi-driver/blob/v1.4.1/LICENSE
#
linux:
  enabled: true

windows:
  enabled: false

# log level. Uses V logs (klog)
logVerbosity: 2

# logging format JSON
logFormatJSON: true

livenessProbe:
  port: 9808
  logLevel: 2

## Maximum size in bytes of gRPC response from plugins
maxCallRecvMsgSize: 4194304

## Install Default RBAC roles and bindings
rbac:
  install: true
  pspEnabled: false

## Install RBAC roles and bindings required for K8S Secrets syncing if true
syncSecret:
  enabled: true

## Enable secret rotation feature [alpha]
enableSecretRotation: true

## Secret rotation poll interval duration
rotationPollInterval: "120s"
