resources:
  - secrets-vault-namespace.yaml

helmCharts:
  #
  # CSI driver
  #
  # Values:
  #     https://github.com/kubernetes-sigs/secrets-store-csi-driver/tree/v1.4.1/charts/secrets-store-csi-driver#configuration
  #
  # Sync:
  #     https://secrets-store-csi-driver.sigs.k8s.io/topics/sync-as-kubernetes-secret
  # Rotate:
  #     https://secrets-store-csi-driver.sigs.k8s.io/topics/secret-auto-rotation
  #
  # Apache 2.0 license:
  #
  #     https://github.com/kubernetes-sigs/secrets-store-csi-driver/blob/v1.4.1/LICENSE
  #
  - name: secrets-store-csi-driver
    repo: https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
    version: 1.4.1
    releaseName: secrets-store-csi-driver
    namespace: kube-system
    valuesFile: secrets-csi-driver-values.yaml

  - name: vault
    repo: https://helm.releases.hashicorp.com
    version: 0.25.0
    releaseName: hashicorp
    namespace: vault
    valuesFile: secrets-vault-values.yaml
